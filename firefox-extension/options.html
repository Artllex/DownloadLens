<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DownloadLens</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <img class="mark" src="icons/icon-48.png" alt="">
      <div class="title-block">
        <h1>DownloadLens</h1>
        <p id="subtitle"></p>
      </div>
      <label class="language-picker">
        <span id="languageLabel"></span>
        <select id="language">
          <option value="auto"></option>
          <option value="en">English</option>
          <option value="pl">Polski</option>
        </select>
      </label>
    </header>

    <section>
      <div class="section-heading">
        <div><h2 id="namesTitle"></h2></div>
        <button type="button" id="addName" class="secondary"></button>
      </div>
      <div id="nameRules" class="routes"></div>
      <p id="namesEmpty" class="empty"></p>
    </section>

    <section class="chatgpt-card">
      <div>
        <span class="badge">ChatGPT</span>
        <h2 id="chatgptTitle"></h2>
        <p id="chatgptDescription"></p>
      </div>
      <label class="toggle-label"><input id="chatgptEnabled" type="checkbox" role="switch"><span id="chatgptToggleLabel"></span></label>
      <label class="chatgpt-folder-field">
        <span id="chatgptFolderLabel"></span>
        <span class="folder-row"><input id="chatgptFolder" type="text"><button id="chatgptBrowse" type="button" class="secondary"></button></span>
        <small id="chatgptFolderHint"></small>
      </label>
    </section>

    <section>
      <div class="section-heading">
        <div>
          <h2 id="routesTitle"></h2>
          <p id="routesDescription"></p>
        </div>
        <button type="button" id="addRoute" class="secondary"></button>
      </div>
      <div id="routes" class="routes"></div>
      <p id="emptyState" class="empty"></p>
    </section>

    <details class="advanced-card">
      <summary id="advancedTitle"></summary>
      <div class="about-content">
        <p id="templateHint" class="muted"></p>
        <h2 id="priorityTitle"></h2>
        <p id="priorityHint" class="muted"></p>
        <div id="priorityRules"></div>
        <button type="button" id="resetPriority" class="secondary"></button>
      </div>
    </details>

    <section class="backup-card">
      <h2 id="backupTitle"></h2>
      <p id="backupDescription"></p>
      <div class="backup-actions">
        <button type="button" id="exportSettings" class="secondary"></button>
        <button type="button" id="importSettings" class="secondary"></button>
        <input id="importFile" type="file" accept=".json,application/json" hidden>
      </div>
      <div id="importReview" hidden>
        <p id="importSummary"></p>
        <button id="confirmImport" type="button" class="secondary"></button>
        <button id="cancelImport" type="button" class="secondary"></button>
      </div>
      <p id="backupStatus" role="status"></p>
    </section>

    <section class="support-card">
      <h2 id="supportTitle"></h2>
      <p id="supportDescription"></p>
      <a id="supportDownload" href="https://github.com/Artllex/DownloadLens/releases/download/v1.3.5/DownloadLens-Support-Setup-1.2.6.exe" target="_blank" rel="noopener noreferrer"></a>
      <small id="supportNote"></small>
    </section>

    <section class="diagnostics">
      <div>
        <h2 id="diagnosticsTitle"></h2>
        <p><span id="versionLabel"></span>: <strong id="extensionVersion"></strong></p>
        <p><span id="activityLabel"></span>: <strong id="lastActivity"></strong></p>
        <small id="activityDetails"></small>
      </div>
    </section>

    <footer>
      <span id="status" role="status"></span>
      <button type="button" id="save" class="primary"></button>
    </footer>
    <details class="about-card">
      <summary id="aboutTitle"></summary>
      <div class="about-content">
        <p class="author">Arkadiusz Pajda <span>· Artllex · 2026</span></p>
        <nav class="about-links" aria-label="About">
          <a href="https://github.com/Artllex" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://www.linkedin.com/in/arkadiusz-pajda" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="privacy.html" id="privacyLink"></a>
        </nav>
      </div>
    </details>
  </main>

  <template id="routeTemplate">
    <div class="route">
      <label>
        <span class="domainLabel"></span>
        <input class="domain" type="text" placeholder="example.com" autocomplete="off">
      </label>
      <label class="folder-field">
        <span class="folderLabel"></span>
        <span class="folder-row">
          <input class="folder" type="text" autocomplete="off">
          <button type="button" class="browse secondary"></button>
        </span>
      </label>
      <button type="button" class="remove icon-button" aria-label="Remove">×</button>
    </div>
  </template>
  <script src="privacy.js"></script>
  <script src="filename-rules.js"></script>
  <script src="options.js"></script>
</body>
</html>
